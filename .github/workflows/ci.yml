name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build
      - name: Ruff format
        run: uv run --no-sync --no-build ruff format --check .
      - name: Ruff lint
        run: uv run --no-sync --no-build ruff check .
      - name: Type check
        run: uv run --no-sync --no-build ty check src tests
      - name: Complexity (Lizard, CCN <= 8)
        run: uvx --no-build lizard==1.25.0 src/ggsad/core -C 8 -w
      - name: Tests (coverage >= 85%)
        run: uv run --no-sync --no-build pytest -q
