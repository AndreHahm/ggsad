schema_version: "1.0"
id: "<change-id>"
method_profile: core
compliance_profile: "governed"
author: "human:ada"
owner: "human:ada"
goal:
  problem: "<problem>"
  done_when: ["<done-when sentence>"]
  non_goals: []
# Paths this change may touch, for example: allow: ["src/"]
scope:
  allow: []
# One requirement per sentence; add examples and evidence commands before approval.
requirements:
  - id: R1
    text: "<done-when sentence>"
    examples: ["Given ..., when ..., then ..."]
    done_when: ["<done-when sentence>"]
gates:
  fail: []
  wait: []
  done: []
