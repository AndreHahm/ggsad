sonar.organization=AndreHahm
sonar.projectKey=AndreHahm_ggsad

# relative paths to source directories. More details and properties are described
# in https://docs.sonarqube.org/latest/project-administration/narrowing-the-focus/
sonar.sources=.
sonar.host.url=https://sonarcloud.io
sonar.python.version=3.13, 3.14

sonar.issue.ignore.multicriteria=p1,p2,p3,p4,p5

# insecure paths in python tools coming from command line input
sonar.issue.ignore.multicriteria.p1.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.p1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p2.ruleKey=pythonsecurity:S8703
sonar.issue.ignore.multicriteria.p2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p3.ruleKey=pythonsecurity:S8704
sonar.issue.ignore.multicriteria.p3.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p4.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.p4.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.p5.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.p5.resourceKey=**/*.py